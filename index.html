<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111827"><meta name="description" content="Ma Veille — opportunités, formations et recherche"><link rel="manifest" href="./manifest.json"><title>Ma Veille</title><style>
:root{--bg:#f3f4f6;--surface:#fff;--text:#111827;--muted:#6b7280;--accent:#111827;--radius:16px;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text)}header{background:var(--accent);color:#fff;padding:22px 16px;position:sticky;top:0;z-index:5}.wrap{max-width:1050px;margin:auto}h1{margin:0 0 5px;font-size:1.45rem}.sub{opacity:.8}.toolbar,.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}button,select,input,textarea{font:inherit;border-radius:11px;border:1px solid #e5e7eb;padding:10px 12px}button{cursor:pointer;background:var(--surface);color:var(--text)}main{padding:20px 16px 50px}.controls{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}.control,.card,.stat{background:var(--surface);border:1px solid #e5e7eb;border-radius:var(--radius);padding:13px}.control label{display:block;color:var(--muted);font-size:.8rem;margin-bottom:5px}.control select{width:100%}.status{color:var(--muted);margin:14px 0}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:15px 0}.stat b{font-size:1.4rem;display:block}.section-title{display:flex;justify-content:space-between;margin:24px 0 10px}.card{margin:10px 0}.card h3{margin:0 0 8px}.meta{color:#4b5563;font-size:.88rem;line-height:1.55}.tags{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}.tag{background:#f3f4f6;border-radius:999px;padding:4px 8px;font-size:.75rem}.new{background:#dcfce7;color:#166534}.link{display:inline-block;background:var(--accent);color:#fff;text-decoration:none;padding:9px 12px;border-radius:10px}.empty{padding:25px;text-align:center;background:var(--surface);border:1px dashed #d1d5db;border-radius:var(--radius)}footer{text-align:center;color:var(--muted);font-size:.78rem;padding:0 16px 25px}@media(max-width:600px){.stats{grid-template-columns:1fr 1fr}.stats .stat:last-child{grid-column:span 2}}
</style></head><body><header><div class="wrap"><h1 id="appTitle">🔎 Ma Veille</h1><div class="sub" id="appSubtitle">Trouvez rapidement les opportunités qui vous intéressent.</div><div class="toolbar"><button onclick="location.href='admin.html'">⚙️ Administration</button><button id="refreshBtn">🔄 Actualiser</button></div></div></header><main class="wrap"><div class="controls"><div class="control"><label>Recherche</label><input id="search" placeholder="Mot-clé, ville, organisme…"></div><div class="control"><label>Catégorie</label><select id="category"><option value="all">Toutes</option><option value="cdi">🎓 Emploi / enseignement</option><option value="l3">💻 Informatique / formations</option><option value="research">🔬 Recherche / doctorat</option><option value="funding">💰 Bourses / financements</option><option value="mobility">🌍 Mobilité</option></select></div><div class="control"><label>Statut</label><select id="statusFilter"><option value="all">Toutes</option><option value="new">🆕 Nouvelles</option><option value="open">🟢 Ouvertes</option></select></div><div class="control"><label>Tri</label><select id="sort"><option value="newest">Plus récentes</option><option value="oldest">Plus anciennes</option></select></div></div><div class="stats"><div class="stat"><span>Total</span><b id="total">0</b></div><div class="stat"><span>Ouvertes</span><b id="open">0</b></div><div class="stat"><span>Nouvelles</span><b id="new">0</b></div></div><div id="status" class="status">Chargement…</div><div id="app"></div></main><footer id="footer">Ma Veille · Votre tableau de bord d’opportunités</footer><script src="./supabase-config.js"></script><script type="module">
import {createClient} from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const cfg=window.SUPABASE_CONFIG||{};const sb=cfg.url&&cfg.anonKey?createClient(cfg.url,cfg.anonKey):null;
const DEMO={updatedAt:'2026-09-16T17:00:00+02:00',items:[]};let data=DEMO;let settings={title:'🔎 Ma Veille',subtitle:'Trouvez rapidement les opportunités qui vous intéressent.',accent:'#111827',radius:16,footer:'Ma Veille · Votre tableau de bord d’opportunités'};
const $=id=>document.getElementById(id);const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const date=s=>{let d=new Date(s);return isNaN(d)?'date non disponible':new Intl.DateTimeFormat('fr-FR',{day:'2-digit',month:'2-digit',year:'numeric'}).format(d)};const valid=u=>{try{return ['http:','https:'].includes(new URL(u).protocol)}catch{return false}};
function applySettings(){document.documentElement.style.setProperty('--accent',settings.accent||'#111827');document.documentElement.style.setProperty('--radius',(settings.radius||16)+'px');$('appTitle').textContent=settings.title;$('appSubtitle').textContent=settings.subtitle;$('footer').textContent=settings.footer||'Ma Veille · Votre tableau de bord d’opportunités';document.title=settings.title.replace(/[^\wÀ-ÿ ]/g,'').trim()||'Ma Veille'}
function render(){let q=$('search').value.toLowerCase().trim(),c=$('category').value,s=$('statusFilter').value,o=$('sort').value;let items=(data.items||[]).filter(x=>(c==='all'||x.category===c)&&(s==='all'||(s==='new'?x.isNew:x.isOpen))&&(!q||JSON.stringify(x).toLowerCase().includes(q)));items.sort((a,b)=>o==='oldest'?new Date(a.publishedAt)-new Date(b.publishedAt):new Date(b.publishedAt)-new Date(a.publishedAt));$('total').textContent=(data.items||[]).length;$('open').textContent=(data.items||[]).filter(x=>x.isOpen).length;$('new').textContent=(data.items||[]).filter(x=>x.isNew).length;let groups=[...new Set(items.map(x=>x.category))];let titles={cdi:'🎓 Emploi / enseignement',l3:'💻 Informatique / formations',research:'🔬 Recherche / doctorat',funding:'💰 Bourses / financements',mobility:'🌍 Mobilité'};let html='';groups.forEach(g=>{let gs=items.filter(x=>x.category===g);html+=`<section><div class="section-title"><h2>${titles[g]||g}</h2><span>${gs.length}</span></div>`;gs.forEach(x=>{html+=`<article class="card"><h3>${esc(x.title)}</h3><div class="meta">🏢 ${esc(x.organization)}<br>📍 ${esc(x.location)}<br>📅 Publication : ${date(x.publishedAt)}${x.deadline?`<br>⏰ Date limite : ${esc(x.deadline)}`:''}</div><div class="tags">${x.isNew?'<span class="tag new">🆕 Nouvelle</span>':''}${x.isOpen?'<span class="tag">🟢 Ouverte</span>':'<span class="tag">⚪ À vérifier</span>'}</div><div class="meta"><b>Conditions :</b> ${esc(x.conditions||'Non précisées')}</div><div class="actions">${valid(x.url)?`<a class="link" href="${esc(x.url)}" target="_blank" rel="noopener">🔗 Voir</a>`:''}</div></article>`});html+='</section>'});$('app').innerHTML=html||'<div class="empty">Aucun résultat pour ces critères.</div>';$('status').textContent=`Dernière mise à jour : ${date(data.updatedAt)} · ${items.length} résultat(s) affiché(s)`}
async function refresh(){try{if(sb){const {data:o,error:oe}=await sb.from('opportunities').select('*').order('published_at',{ascending:false});if(oe)throw oe;const {data:s,error:se}=await sb.from('settings').select('*').eq('id',1).maybeSingle();if(se)throw se;if(s)settings={...settings,title:s.title,subtitle:s.subtitle,accent:s.accent,radius:s.radius,footer:s.footer};data={updatedAt:new Date().toISOString(),items:(o||[]).map(x=>({id:x.id,title:x.title,organization:x.organization||'',url:x.url||'',conditions:x.conditions||'',category:x.category||'cdi',location:x.location||'',publishedAt:x.published_at||'',deadline:x.deadline||'',isNew:!!x.is_new,isOpen:!!x.is_open}))};applySettings();render();return}let r=await fetch('./veille.json?ts='+Date.now(),{cache:'no-store'});if(!r.ok)throw 0;data=await r.json()}catch{data=DEMO}render()}
['search','category','statusFilter','sort'].forEach(id=>$(id).addEventListener('input',render));$('refreshBtn').onclick=refresh;applySettings();refresh();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
