<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#111827">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <title>Ma Veille</title>
  <style>
    *{box-sizing:border-box} body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#f3f4f6;color:#111827}
    header{background:#111827;color:white;padding:22px 18px 18px;position:sticky;top:0;z-index:5}
    h1{margin:0;font-size:24px} header p{margin:5px 0 0;opacity:.8;font-size:14px}
    main{max-width:760px;margin:auto;padding:14px}
    .actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
    button,select{border:0;border-radius:12px;padding:13px;font-size:15px;background:white;box-shadow:0 1px 5px #0001}
    button:active{transform:scale(.98)} .primary{background:#111827;color:white}
    .filters{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
    .card{background:white;border-radius:16px;padding:16px;margin:10px 0;box-shadow:0 2px 8px #0000000d}
    .tag{display:inline-block;border-radius:999px;padding:5px 9px;font-size:12px;background:#e5e7eb;margin-bottom:8px}
    .new{background:#dcfce7}.title{font-weight:700;font-size:17px;margin:3px 0 8px}.meta{font-size:13px;color:#4b5563;line-height:1.55}
    .card a{display:inline-block;margin-top:10px;text-decoration:none;font-weight:650;color:#1d4ed8}
    .section{font-size:18px;font-weight:750;margin:20px 0 8px}.empty{text-align:center;padding:30px;color:#6b7280}
    footer{text-align:center;color:#6b7280;font-size:12px;padding:20px}
  </style>
</head>
<body>
<header><h1>🔎 Ma Veille</h1><p>CDI Anglais + L3 Informatique</p></header>
<main>
  <div class="actions">
    <button class="primary" id="refresh">🔄 Actualiser</button>
    <button id="clear">🧹 Réinitialiser</button>
  </div>
  <div class="filters">
    <select id="category"><option value="all">☰ Toutes les catégories</option><option value="cdi">🎓 CDI – Anglais</option><option value="info">💻 L3 Informatique</option></select>
    <select id="sort"><option value="new">↕️ Plus récent</option><option value="old">↕️ Plus ancien</option></select>
  </div>
  <div id="content"></div>
  <footer>Version 1.0 · Interface locale de consultation</footer>
</main>
<script>
const demo = [
 {cat:"cdi",new:true,title:"Exemple — Enseignant d’anglais (CDI)",org:"Employeur à remplacer par une offre réelle",place:"France",date:"2026-09-16",deadline:"À vérifier",req:"CDI · profil compatible à vérifier",url:"#"},
 {cat:"info",new:true,title:"Exemple — L3 Informatique",org:"Établissement à remplacer par une formation réelle",place:"France / Distance",date:"2026-09-15",deadline:"À vérifier",req:"Admission en L3 à vérifier",url:"#"}
];
let data = JSON.parse(localStorage.getItem("veilleData") || "null") || demo;

function fmt(d){ if(!d) return "Date non disponible"; const x=new Date(d+"T00:00:00"); return isNaN(x)?"Date non disponible":x.toLocaleDateString("fr-FR",{day:"2-digit",month:"2-digit",year:"numeric"}); }
function render(){
 const cat=document.getElementById("category").value, sort=document.getElementById("sort").value;
 let items=data.filter(x=>cat==="all"||x.cat===cat).sort((a,b)=>{
   const da=a.date?new Date(a.date):new Date(0), db=b.date?new Date(b.date):new Date(0);
   return sort==="new"?db-da:da-db;
 });
 const groups = cat==="all" ? [["cdi","🎓 CDI – Enseignant d’anglais"],["info","💻 L3 Informatique"]] : [[cat,cat==="cdi"?"🎓 CDI – Enseignant d’anglais":"💻 L3 Informatique"]];
 let html="";
 groups.forEach(([g,label])=>{
   const arr=items.filter(x=>x.cat===g); if(!arr.length) return;
   html += `<div class="section">${label}</div>`;
   arr.forEach(x=>html+=`<article class="card">
     <span class="tag ${x.new?"new":""}">${x.new?"🆕 Nouvelle opportunité":"Opportunité"}</span>
     <div class="title">${esc(x.title)}</div>
     <div class="meta"><b>Établissement / employeur :</b> ${esc(x.org)}<br>
     <b>Lieu / format :</b> ${esc(x.place)}<br>
     <b>Publication :</b> ${fmt(x.date)}<br>
     <b>Date limite :</b> ${esc(x.deadline||"Non disponible")}<br>
     <b>Conditions :</b> ${esc(x.req||"À vérifier")}</div>
     ${x.url&&x.url!="#"?`<a href="${esc(x.url)}" target="_blank" rel="noopener">Voir la source →</a>`:""}
   </article>`);
 });
 document.getElementById("content").innerHTML=html||'<div class="empty">Aucun résultat dans cette catégorie.</div>';
}
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));}
document.getElementById("refresh").onclick=()=>{ alert("Actualisation demandée. La version 1.0 affiche actuellement les données enregistrées localement. La connexion à la veille automatique sera ajoutée dans l’étape suivante."); };
document.getElementById("clear").onclick=()=>{localStorage.removeItem("veilleData");data=demo;render();};
document.getElementById("category").onchange=render; document.getElementById("sort").onchange=render; render();
if("serviceWorker" in navigator) window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
</script>
</body></html>
