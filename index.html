<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<meta name="description" content="Veille CDI enseignant d’anglais et formations L3 Informatique">
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<title>Ma Veille — CDI Anglais + L3 Informatique</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#f3f4f6;color:#111827}header{background:#111827;color:#fff;padding:20px 16px;position:sticky;top:0;z-index:10}header>div,main{max-width:900px;margin:auto}h1{margin:0;font-size:23px}.sub{margin-top:5px;opacity:.78;font-size:13px}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:14px}button,select{border:0;border-radius:11px;padding:11px 13px;font:inherit}button{cursor:pointer}.primary{background:#fff;color:#111827}main{padding:16px}.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-bottom:15px}.control{background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:9px}.control label{display:block;font-size:12px;color:#6b7280;margin-bottom:5px}.control select{width:100%;background:#f9fafb;border:1px solid #e5e7eb}.status{font-size:13px;color:#4b5563;margin:8px 0 16px}.section{display:flex;justify-content:space-between;align-items:center;margin:20px 0 8px;font-size:18px;font-weight:750}.count{font-size:12px;background:#e5e7eb;border-radius:99px;padding:4px 8px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:15px;padding:15px;margin:9px 0;box-shadow:0 2px 8px #0000000b}.tag{display:inline-block;border-radius:99px;padding:4px 8px;font-size:11px;background:#e5e7eb;margin-bottom:7px}.new{background:#dcfce7;color:#166534}.open{background:#dbeafe;color:#1e40af}.title{font-weight:700;font-size:17px;margin:2px 0 7px}.meta{font-size:13px;color:#4b5563;line-height:1.55}.card a{display:inline-block;margin-top:11px;text-decoration:none;font-weight:650;color:#1d4ed8}.empty{text-align:center;padding:28px;color:#6b7280;background:#fff;border:1px dashed #d1d5db;border-radius:12px}.note{background:#fff7ed;border:1px solid #fed7aa;color:#9a3412;border-radius:11px;padding:11px;font-size:12px;margin-top:12px}footer{text-align:center;color:#6b7280;font-size:11px;padding:20px}
</style>
</head>
<body>
<header><div><h1>🔎 Ma Veille</h1><div class="sub">CDI Anglais + L3 Informatique · Version 2.0</div><div class="actions"><button class="primary" id="refresh">🔄 Actualiser</button><button id="clear">↺ Réinitialiser</button></div></div></header>
<main>
<div class="filters">
<div class="control"><label for="category">Catégorie</label><select id="category"><option value="all">Toutes les catégories</option><option value="cdi">🎓 CDI – Enseignant d’anglais</option><option value="info">💻 L3 Informatique</option></select></div>
<div class="control"><label for="sort">Tri</label><select id="sort"><option value="new">Plus récente → plus ancienne</option><option value="old">Plus ancienne → plus récente</option></select></div>
<div class="control"><label for="statusFilter">Statut</label><select id="statusFilter"><option value="all">Tous</option><option value="new">🆕 Nouvelles</option><option value="open">🟢 Encore ouvertes</option></select></div>
</div>
<div id="status" class="status">Chargement…</div><div id="content"></div>
<div class="note">ℹ️ L’application est prête à charger automatiquement <b>veille.json</b>. La prochaine étape consiste à alimenter ce fichier avec les résultats réels de ta veille.</div>
<footer>Ma Veille PWA · Les liens ouvrent la source dans un nouvel onglet.</footer>
</main>
<script>
const DEMO=[{cat:'cdi',new:true,open:true,title:'Exemple — Enseignant d’anglais (CDI)',org:'Donnée de démonstration',place:'France',date:'2026-09-16',deadline:'À vérifier',req:'CDI · éligibilité à vérifier',url:'https://www.google.com/search?q=offre+CDI+enseignant+anglais+France'},{cat:'info',new:true,open:true,title:'Exemple — L3 Informatique',org:'Donnée de démonstration',place:'France / Distance',date:'2026-09-15',deadline:'À vérifier',req:'Admission directe en L3 à vérifier',url:'https://www.google.com/search?q=L3+informatique+admission+France'}];
let data=JSON.parse(localStorage.getItem('veilleData')||'null')||DEMO;
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
const date=s=>{if(!s)return 'date non disponible';const d=new Date(s+'T00:00:00');return isNaN(d)?'date non disponible':d.toLocaleDateString('fr-FR',{day:'2-digit',month:'2-digit',year:'numeric'})};
function render(){let cat=category.value,order=sort.value,sf=statusFilter.value;let items=data.filter(x=>cat==='all'||x.cat===cat).filter(x=>sf==='all'||(sf==='new'?x.new:x.open)).sort((a,b)=>{let da=a.date?new Date(a.date):new Date(0),db=b.date?new Date(b.date):new Date(0);return order==='new'?db-da:da-db});let groups=cat==='all'?[['cdi','🎓 CDI – Enseignant d’anglais'],['info','💻 L3 Informatique']]:[[cat,cat==='cdi'?'🎓 CDI – Enseignant d’anglais':'💻 L3 Informatique']];let html='';groups.forEach(([g,label])=>{let arr=items.filter(x=>x.cat===g);html+=`<section><div class="section"><span>${label}</span><span class="count">${arr.length}</span></div>`;if(!arr.length){html+='<div class="empty">Aucun résultat pour ce filtre.</div></section>';return}arr.forEach(x=>{html+=`<article class="card"><span class="tag ${x.new?'new':''}">${x.new?'🆕 Nouvelle':'Opportunité'}</span>${x.open?'<span class="tag open">🟢 Ouverte</span>':''}<div class="title">${esc(x.title)}</div><div class="meta"><b>🏢 Établissement / employeur :</b> ${esc(x.org)}<br><b>📍 Lieu / format :</b> ${esc(x.place)}<br><b>📅 Publication :</b> ${date(x.date)}<br><b>⏰ Date limite :</b> ${esc(x.deadline||'Non disponible')}<br><b>📋 Conditions :</b> ${esc(x.req||'À vérifier')}</div>${x.url&&/^https?:\/\//i.test(x.url)?`<a href="${esc(x.url)}" target="_blank" rel="noopener noreferrer">🔗 Voir l’offre / la formation →</a>`:''}</article>`});html+='</section>'});content.innerHTML=html||'<div class="empty">Aucun résultat.</div>';status.textContent=`Dernière mise à jour : ${data.updatedAt?date(data.updatedAt):'date non disponible'} · ${data.length??data.items?.length??0} résultat(s)`}
async function refreshData(){status.textContent='🔄 Actualisation…';try{let r=await fetch('./veille.json?ts='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error();let j=await r.json();if(!Array.isArray(j.items))throw Error();data=j.items;localStorage.setItem('veilleData',JSON.stringify(data));localStorage.setItem('veilleUpdatedAt',j.updatedAt||'');status.textContent='✅ Données de veille actualisées.';render()}catch(e){status.textContent='ℹ️ Le fichier de veille réel n’est pas encore disponible ; affichage des données locales.';render()}}
category.onchange=render;sort.onchange=render;statusFilter.onchange=render;refresh.onclick=refreshData;clear.onclick=()=>{localStorage.removeItem('veilleData');localStorage.removeItem('veilleUpdatedAt');data=DEMO;render()};render();
if('serviceWorker' in navigator) addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script>
</body></html>
