name: Mise à jour de Ma Veille

on:
  schedule:
    - cron: '17 5 * * *'
      timezone: 'Europe/Paris'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-veille:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Mettre à jour veille.json
        run: python scripts/update_veille.py

      - name: Enregistrer les nouveaux résultats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add veille.json
          if git diff --cached --quiet; then
            echo "Aucune nouvelle opportunité."
          else
            git commit -m "Mise à jour automatique de la veille"
            git push
          fi
