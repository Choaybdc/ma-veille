name: Mise à jour de Ma Veille

on:
  push:
    paths:
      - 'scripts/update_veille.py'
      - 'scripts/send_notifications.py'
      - '.github/workflows/veille.yml'
  schedule:
    # Contrôle fréquent : GitHub Actions peut retarder les tâches planifiées en période de charge.
    - cron: '*/15 * * * *'
      timezone: 'Europe/Paris'
  workflow_dispatch:

permissions:
  contents: write

# Prevent scheduled/manual runs from racing while committing veille.json.
concurrency:
  group: ma-veille-update
  cancel-in-progress: false

jobs:
  update-veille:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Mettre à jour veille.json
        run: python scripts/update_veille.py

      - name: Envoyer les alertes email pour les nouvelles opportunités
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
        run: python scripts/send_notifications.py

      - name: Enregistrer les nouveaux résultats et l’état des notifications
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add veille.json notifications_state.json
          if git diff --cached --quiet; then
            echo "Aucune modification à enregistrer."
          else
            git commit -m "Mise à jour automatique de la veille"
            git pull --rebase origin main
            git push
          fi
